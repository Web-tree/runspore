name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release-please.yml starts it on the release PR, which GITHUB_TOKEN pushes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version, components and targets; rustup installs them on first cargo call.
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: shellcheck install.sh scripts/*.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - run: ./actionlint -color

  # install.sh against signed archives on macOS too (spec/release.md section 9).
  install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p runspore-cli --test install --locked
