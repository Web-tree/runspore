# Every push to main: release-please opens or updates the release PR, and release.yml
# builds the four archives. When the push is the merge of the release PR, release-please
# tags v<version> and makes the GitHub release, and release.yml signs, attests and
# uploads the assets to it in the same run. spec/release.md section 8.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # As the webtree-release App, so the release PR gets its pull_request checks. Its
  # credentials come through AWS_ROLE, a secret of the release environment, which only
  # main may use; `secrets: inherit` is the only way an environment secret reaches it,
  # so the workflow is pinned to a commit. The release PR merges itself once its
  # required checks pass, which releases every releasable change.
  release-please:
    permissions:
      id-token: write
      checks: read
      pull-requests: read
    uses: Web-tree/actions/.github/workflows/release-please.yml@cece6160ad54272e48173ef5fd95adae32705110 # v1.2.0
    with:
      auto-merge: true
      aws-region: eu-central-1
      app-id-parameter: /webtree/github/apps/webtree-release/app-id
      private-key-parameter: /webtree/github/apps/webtree-release/private-key
    secrets: inherit

  release:
    needs: release-please
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || '' }}
    secrets:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
