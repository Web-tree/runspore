[package]
name = "runspore-wasmtime"
description = "Reducer that runs the Runspore kernel component through Wasmtime, one fresh instance per transition."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build/main.rs"
# `prebuilt/` is ignored by git but goes into the published crate (build/main.rs).
include = ["/src", "/build", "/wit", "/prebuilt", "/README.md"]

[dependencies]
runspore-types.workspace = true
wasmtime = { version = "51.0.0", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }

[build-dependencies]
wit-component = { version = "0.263.0", default-features = false }

[dev-dependencies]
runspore-build = { path = "../runspore-build" }
runspore-kernel.workspace = true
runspore-trace = { path = "../runspore-trace" }
serde_json.workspace = true
wasmparser = { version = "0.263.0", default-features = false, features = ["std", "component-model"] }
wit-component = { version = "0.263.0", default-features = false }

[lints]
workspace = true
