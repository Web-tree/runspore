[package]
name = "runspore-host"
description = "Runspore engine: coordinates transitions and runs activities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
runspore-types.workspace = true
runspore-kernel.workspace = true
runspore-schema.workspace = true
runspore-wasmtime = { path = "../runspore-wasmtime" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
nix = { version = "0.31.3", features = ["signal", "process", "fs", "hostname"] }
getrandom = "0.4.3"
wasmtime = { version = "50.0.0", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
sysctl = "0.7.1"

[dev-dependencies]
runspore-build = { path = "../runspore-build" }
runspore-store-sqlite = { path = "../runspore-store-sqlite" }
runspore-store-conformance = { path = "../runspore-store-conformance" }
rusqlite = { version = "0.41.0", features = ["bundled"] }

[lints]
workspace = true
