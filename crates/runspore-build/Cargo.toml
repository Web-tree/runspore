[package]
name = "runspore-build"
description = "Runspore build: a workflow folder (workflow.dot and settings.json) to the package the kernel runs and its workflow artifact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
runspore-types.workspace = true
runspore-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1.2.3"
jsonschema = { version = "0.58.6", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
wasm-encoder = { version = "0.261.0", default-features = false, features = ["component-model"] }
wit-component = { version = "0.262.0", default-features = false }
wit-parser = { version = "0.261.0", default-features = false }

[lints]
workspace = true
