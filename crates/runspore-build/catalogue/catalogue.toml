[[code]]
code = "schema.input-outside-subset"
severity = "problem"
title = '''Input schema outside what spore checks'''
message = '''The input schema of {workflow} is outside what spore checks, at {keyword}: {reason}.'''
fix = '''use only the parts of JSON Schema that spec/schema.md lists.'''
