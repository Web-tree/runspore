# ---------------------------------------------------------------------------
# Actions
# ---------------------------------------------------------------------------

[[code]]
code = "action.bad-name"
severity = "problem"
title = '''Action name with other characters'''
message = '''Action {action} has a name spore cannot use; an action name has letters, digits, "_" and "-", at most 64.'''
fix = '''rename it, and every "action" that names it.'''
example = "action.bad-name"

[[code]]
code = "action.no-effect"
severity = "problem"
title = '''Missing "effect"'''
message = '''Action {action} does not say whether it is safe to run again after a crash.'''
fix = '''add one of {choices} to action {action}. For example:'''
show-fix = true
why = '''spore runs a step again after a crash only when its effect says that is safe.'''
explanation = '''
A run can stop at any moment: the machine reboots, the process is killed, the
network goes away. When the run goes on, spore has to decide what to do with a step
that may or may not have finished. The action's effect tells it:

- "pure": the step only computes; running it again gives the same result.
- "read-only": it reads the world but changes nothing.
- "idempotent": it changes the world, and running it again changes nothing more,
  such as copying a file to the same place.
- "unsafe": running it twice could do harm, such as sending an email or charging a
  card. spore never runs it again on its own; the run waits for a person
  (spore resolve).

spore does not guess, because a wrong guess either repeats something harmful or
stops a run that could have gone on.
'''
args = { choices = "computed" }
example = "nightly-backup"
also = ["dot.no-start", "dot.missing-arrow", "settings.misplaced-key", "command.argv-spaces"]

[[code]]
code = "action.unknown-effect"
severity = "problem"
title = '''Unknown effect'''
message = '''Action {action} has effect {effect}, which spore does not know.'''
fix = '''use one of {choices}.'''
args = { effect = "input", choices = "computed" }
example = "action.unknown-effect"

[[code]]
code = "action.unsupported-effect"
severity = "problem"
title = '''Effect this spore cannot run'''
message = '''Action {action} has effect {effect}, which this spore cannot run yet.'''
fix = '''use one of {choices}.'''
args = { effect = "input", choices = "computed" }
example = "action.unsupported-effect"

[[code]]
code = "action.no-kind"
severity = "problem"
title = '''Missing "kind"'''
message = '''Action {action} does not say what kind of action it is.'''
fix = '''add "kind": "command" to run a program.'''
example = "action.no-kind"

[[code]]
code = "action.unknown-kind"
severity = "problem"
title = '''Unknown kind of action'''
message = '''Action {action} has kind {kind}, which this spore cannot run.'''
fix = '''use one of {choices}.'''
args = { kind = "input", choices = "computed" }
example = "action.unknown-kind"

[[code]]
code = "action.no-outcomes"
severity = "problem"
title = '''Empty "outcomes"'''
message = '''Action {action} lists no outcomes in "outcomes".'''
fix = '''remove the empty list, so the action ends with "ok", or list its outcomes.'''
example = "action.no-outcomes"

[[code]]
code = "action.bad-outcome"
severity = "problem"
title = '''Not an outcome name'''
message = '''Outcome {outcome} of action {action} is not an outcome name; an outcome has lowercase letters, digits and "-", and starts with a letter or digit.'''
fix = '''rename it with those characters only.'''
args = { outcome = "input" }
example = "action.bad-outcome"

[[code]]
code = "action.reserved-outcome"
severity = "problem"
title = '''Outcome spore keeps for itself'''
message = '''Action {action} lists {outcome}, an outcome spore keeps for itself.'''
fix = '''remove it; spore gives a step {outcome} on its own.'''
args = { outcome = "input" }
example = "action.reserved-outcome"

[[code]]
code = "action.repeated-outcome"
severity = "problem"
title = '''Outcome listed twice'''
message = '''Action {action} lists the outcome {outcome} twice.'''
fix = '''remove the second one.'''
args = { outcome = "input" }
example = "action.repeated-outcome"

[[code]]
code = "action.lease-too-long"
severity = "problem"
title = '''Lease not shorter than the deadline'''
message = '''Action {action} asks whoever holds it to renew every {lease} ms, but the step ends after {timeout} ms anyway.'''
fix = '''make "leaseMs" smaller than "timeoutMs", or remove it so the deadline alone bounds the step.'''
why = '''a lease only helps when it runs out before the deadline: it frees a step whose holder stopped renewing.'''
args = { lease = "input", timeout = "computed" }
example = "action.lease-too-long"

[[code]]
code = "action.unknown-function"
severity = "problem"
title = '''Unknown native function'''
message = '''Action {action} calls the native function {function}, which this spore does not have.'''
fix = '''run a program instead, with "kind": "command" and "argv".'''
args = { function = "input" }
example = "action.unknown-function"

[[code]]
code = "action.component-unsupported"
severity = "problem"
title = '''Component program'''
message = '''Action {action} names a component as its {program}, which this spore cannot run.'''
fix = '''write it as a program instead, in the form {{"command": {{"argv": ["check-alive"]}}}}.'''
why = '''spore refuses a workflow it cannot run as written before the run starts, never part way through.'''
args = { program = "computed" }
example = "action.component-unsupported"

[[code]]
code = "action.no-result-channel"
severity = "problem"
title = '''No result channel this spore offers'''
message = '''Action {action} reports its result through {channels}, and this spore offers only {offered}.'''
fix = '''remove "channels", so the action reports through "store", or add "store" to the list.'''
why = '''the run records the channel it picks at start and keeps it, so the step must have one this spore offers.'''
args = { channels = "input", offered = "computed" }
example = "action.no-result-channel"

[[code]]
code = "command.no-argv"
severity = "problem"
title = '''Missing "argv"'''
message = '''Action {action} runs a command, but has no "argv" to say which.'''
fix = '''add "argv": the program, then each argument as its own item, such as ["make", "test"].'''
example = "command.no-argv"

[[code]]
code = "command.bad-exit-code"
severity = "problem"
title = '''Not an exit code'''
message = '''{exit} in "exitOutcomes" of action {action} is not an exit code.'''
fix = '''use a whole number, such as "1".'''
args = { exit = "key" }
example = "command.bad-exit-code"

[[code]]
code = "command.result-exit-zero"
severity = "problem"
title = '''Outcome for exit code 0 in result mode'''
message = '''Action {action} reads its result from what it prints when it exits with 0, so "exitOutcomes" cannot give 0 an outcome.'''
fix = '''remove "0" from "exitOutcomes".'''
example = "command.result-exit-zero"

[[code]]
code = "command.result-not-json"
severity = "problem"
title = '''"result" without JSON output'''
message = '''Action {action} maps its outcome and output from what it prints with "result", which reads that as JSON, but its "output" is not "json".'''
fix = '''set "output" to "json", or remove "result".'''
example = "command.result-not-json"

[[code]]
code = "command.exit-outcome"
severity = "problem"
title = '''Exit code for an outcome the action does not list'''
message = '''Exit code {exit} of action {action} gives the outcome {outcome}, which the action does not list in "outcomes".'''
fix = '''add {outcome} to "outcomes", or give the exit code an outcome the action lists.'''
args = { exit = "key", outcome = "input" }
example = "command.exit-outcome"
also = ["dot.undeclared-outcome"]

[[code]]
code = "command.cwd-not-pointer"
severity = "problem"
title = '''Working folder from input not a JSON Pointer'''
message = '''{value} in "cwd" of action {action} is not a JSON Pointer into the step's input; a pointer is empty or starts with "/".'''
fix = '''write where the step's input holds the folder, starting with "/", such as "/checkout".'''
args = { value = "input" }
example = "command.cwd-not-pointer"

[[code]]
code = "command.argv-spaces"
severity = "warning"
title = '''Program name with spaces'''
message = '''{item} is read as one program name. spore does not use a shell, so the words are not split.'''
fix = '''give each word its own item.'''
show-fix = true
explanation = '''
spore starts a command's program directly, the way exec does, without a shell. The
first item of "argv" is the program and each other item is one argument, passed as it
is: no splitting at spaces, no quotes, no "$VARIABLES", no globs, no pipes.

So ["pg_dump --format=custom shop"] looks for a program whose name is that whole
line, and the step fails when it starts. Give each word its own item:
["pg_dump", "--format=custom", "shop"]. spore marks this split as safe to apply with
`spore validate --fix` when the line has no quotes, "$", globs or backslashes; with
any of those, it needs a look, since a shell would have read them.

To run shell syntax on purpose, run the shell: ["sh", "-c", "pg_dump … | gzip"].

This is a warning, not a problem, because a program whose file name really has
spaces in it is allowed.
'''
args = { item = "input" }
example = "nightly-backup"
also = ["dot.no-start", "dot.missing-arrow", "settings.misplaced-key", "action.no-effect"]

[[code]]
code = "command.program-not-found"
severity = "warning"
title = '''Program not found'''
message = '''Program {program} of action {action} is not on this machine's PATH.'''
fix = '''install it, or name it by its full path.'''
why = '''the run may happen on another machine, so this is only a warning.'''
args = { program = "input" }
example = "command.program-not-found"

