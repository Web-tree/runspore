[package]
name = "runspore-test-runner"
description = "Test-only step runner: a WebAssembly component of world `runner` whose start, probe and stop do what the step's input asks. Never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json.workspace = true
wit-bindgen = { version = "0.63.0", default-features = false, features = ["macros", "realloc"] }

# Generated export glue uses `#[unsafe(export_name)]` and raw ABI pointers.
[lints.rust]
unsafe_code = "allow"
