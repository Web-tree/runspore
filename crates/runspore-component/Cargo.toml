[package]
name = "runspore-component"
description = "The Runspore kernel exported as an import-free WebAssembly component (world `machine`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Test-only guest: replaces the kernel with echo, loop, trap and memory behaviours
# so the host can exercise every boundary conversion and watchdog. Never shipped.
echo = ["dep:serde_json"]

[dependencies]
runspore-types.workspace = true
runspore-kernel.workspace = true
serde_json = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.62.0", default-features = false, features = ["macros", "realloc"] }

# Generated export glue uses `#[unsafe(export_name)]` and raw ABI pointers.
[lints.rust]
unsafe_code = "allow"
