[package]
# Published as `runspore`, so `cargo install runspore` installs `spore`; the folder
# keeps its name.
name = "runspore"
description = "Run durable workflows from your terminal: the spore CLI, with its engine, SQLite store and kernel component in one process"
readme = "README.md"
keywords = ["workflow", "durable", "agents", "cli", "sqlite"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "spore"
path = "src/main.rs"

[dependencies]
runspore-types.workspace = true
runspore-kernel.workspace = true
runspore-schema.workspace = true
runspore-build.workspace = true
runspore-host.workspace = true
runspore-store-sqlite.workspace = true
runspore-wasmtime.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
hex.workspace = true
sha2.workspace = true
nix = { version = "0.32.0", features = ["signal", "hostname"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }

[lints]
workspace = true
