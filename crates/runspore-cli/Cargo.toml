[package]
name = "runspore-cli"
description = "The spore binary of Runspore: engine, SQLite store and kernel component in one process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "spore"
path = "src/main.rs"

[dependencies]
runspore-types.workspace = true
runspore-kernel.workspace = true
runspore-schema.workspace = true
runspore-build = { path = "../runspore-build" }
runspore-host = { path = "../runspore-host" }
runspore-store-sqlite = { path = "../runspore-store-sqlite" }
runspore-wasmtime = { path = "../runspore-wasmtime" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
hex.workspace = true
sha2.workspace = true
nix = { version = "0.31.3", features = ["signal", "hostname"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }

[lints]
workspace = true
