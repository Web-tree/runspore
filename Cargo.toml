[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

# Shared pins. A crate that needs anything else declares it in its own
# Cargo.toml with an explicit version; do not add entries here from a package branch.
[workspace.dependencies]
runspore-types = { path = "crates/runspore-types" }
runspore-kernel = { path = "crates/runspore-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "signal", "io-util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
